version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tribely_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tribely_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-tribely_prod_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tribely_admin} -d ${POSTGRES_DB:-tribely_prod_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tribely_prod_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: tribely_prod_worker
    restart: always
    command: arq app.workers.audit_worker.WorkerSettings
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: ${POSTGRES_USER:-tribely_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-tribely_prod_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-prod_jwt_secret_key_change_me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: tribely_prod_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: ${POSTGRES_USER:-tribely_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-tribely_prod_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-prod_jwt_secret_key_change_me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: tribely_prod_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      - api

volumes:
  postgres_prod_data:
  redis_prod_data:
